name: wiki
# Publishes docs/*.md to the GitHub wiki (the wiki must exist, i.e. have at least one page).
on:
  push:
    branches: [main]
    paths: ["docs/*.md", ".github/workflows/wiki.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish docs to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          find wiki -maxdepth 1 -name '*.md' -delete
          declare -A title=( [README]=Home [getting-started]=Getting-started [architecture]=How-it-works
                             [game-database]=Game-database [operations]=Operating-during-an-event
                             [troubleshooting]=Troubleshooting [development]=Development-and-lab )
          for f in docs/*.md; do
            name=$(basename "$f" .md)
            out=${title[$name]:-$name}
            sed -E -e 's#\]\((getting-started|architecture|game-database|operations|troubleshooting|development)\.md\)#](\1)#g' \
                   -e 's#\]\(getting-started\)#](Getting-started)#g; s#\]\(architecture\)#](How-it-works)#g' \
                   -e 's#\]\(game-database\)#](Game-database)#g; s#\]\(operations\)#](Operating-during-an-event)#g' \
                   -e 's#\]\(troubleshooting\)#](Troubleshooting)#g; s#\]\(development\)#](Development-and-lab)#g' \
                   -e "s#\]\((research/)#](https://github.com/${GITHUB_REPOSITORY}/tree/main/docs/\1#g" \
                   "$f" > "wiki/$out.md"
          done
          cat > wiki/_Sidebar.md <<'EOF'
          **Netsession Relay**
          - [Home](Home)
          - [Getting started](Getting-started)
          - [How it works](How-it-works)
          - [Game database](Game-database)
          - [Operating during an event](Operating-during-an-event)
          - [Troubleshooting](Troubleshooting)
          - [Development and lab](Development-and-lab)
          EOF
          sed -i 's/^          //' wiki/_Sidebar.md
          cd wiki
          git config user.name "Netsession Relay CI"
          git config user.email noreply@netsession.net
          git add -A
          git diff --cached --quiet && echo "wiki up to date" && exit 0
          git commit -q -m "Sync wiki from docs/ (${GITHUB_SHA::8})"
          git push
