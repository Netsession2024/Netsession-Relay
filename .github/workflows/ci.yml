name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l cmd internal games)"
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -count=1 ./...
