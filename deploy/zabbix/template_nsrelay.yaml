                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: nsrelay.monitoring
              tags:
                - tag: vlan
                  value: '{#VID} {#NAME}'
            - uuid: f008f900a9974228a40491cbb65c567b
              name: 'Netz {#NAME} (VLAN {#VID}): Sekunden ohne Empfang'
              type: DEPENDENT
              key: 'nsrelay.vlan.silent_s[{#VID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              units: 's'
              preprocessing:
