      discovery_rules:
        - uuid: d240b070c9ef408eba46286488b22d7a
          name: 'Relay: Netze (VLANs)'
          type: DEPENDENT
          key: nsrelay.vlan.discovery
          delay: '0'
          lifetime: 7d
          item_prototypes:
            - uuid: 6b9a718050614721afd3945120aa7fff
              name: 'Netz {#NAME} (VLAN {#VID}): empfangen pro Sekunde'
              type: DEPENDENT
              key: 'nsrelay.vlan.in.rate[{#VID}]'
              delay: '0'
              history: 30d
              value_type: UNSIGNED
              units: 'fps'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.vlan_list[?(@.vid=={#VID})].in_per_s.first()'
              master_item:
                key: nsrelay.monitoring
              tags:
                - tag: vlan
                  value: '{#VID} {#NAME}'
            - uuid: 655f238700a244069755a32bd78245a5
              name: 'Netz {#NAME} (VLAN {#VID}): gesendet pro Sekunde'
              type: DEPENDENT
              key: 'nsrelay.vlan.out.rate[{#VID}]'
