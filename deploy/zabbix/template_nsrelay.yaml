zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: db0c8a77aaff4e23b6ca23edeba3e05a
      name: Templates/Applications
  templates:
    - uuid: 553620f52abe4073bb84be9bd031312d
      template: 'Netsession Relay'
      name: 'Netsession Relay'
      description: |
        Netsession Relay (UDP broadcast relay for LAN games).
        Polls {$NSRELAY.URL}/api/v1/monitoring every 30 s (HTTP agent). The token is created on the
        System page of the relay. Set {$NSRELAY.URL} and {$NSRELAY.TOKEN} on the host.
        Generated by tools/gen_zabbix_template.py, do not edit by hand.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 0adfe0aab1f241cebbb7747c00d81144
          name: 'Relay: monitoring JSON'
          type: HTTP_AGENT
          key: nsrelay.monitoring
          delay: 30s
          history: 1h
          value_type: TEXT
          trends: '0'
          url: '{$NSRELAY.URL}/api/v1/monitoring'
          headers:
            - name: Authorization
              value: 'Bearer {$NSRELAY.TOKEN}'
          timeout: 5s
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 1d109ee9f1bd4f55a0bf8cc3dd577bcf
              expression: 'nodata(/Netsession Relay/nsrelay.monitoring,3m)=1'
              name: 'Relay: Web-Teil antwortet nicht'
              priority: HIGH
              description: 'Seit 3 Minuten keine Antwort von /api/v1/monitoring: Web-Container, Token oder VM prüfen.'
        - uuid: 00e37929f0ea4b00af1c5642629476a7
          name: 'Relay: Engine erreichbar'
          type: DEPENDENT
          key: 'nsrelay.engine.up'
          delay: '0'
          history: 30d
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.engine_up'
          master_item:
            key: nsrelay.monitoring
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 095a0a312fd844ae95de60abe00f53ce
              expression: 'last(/Netsession Relay/nsrelay.engine.up)=0'
              name: 'Relay: Engine antwortet nicht'
              priority: HIGH
              description: 'Die Web-Rolle erreicht die Engine nicht über den Unix-Socket. Engine-Container prüfen.'
        - uuid: 3bb7b3a629a549699097a7edf9e4df57
          name: 'Relay: Betriebsart'
          type: DEPENDENT
          key: 'nsrelay.mode'
          delay: '0'
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'active, observe, paused oder leer vor dem ersten Stand.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.mode'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: nsrelay.monitoring
          tags:
            - tag: component
              value: relay
        - uuid: 5bdc89ee4c284ad193335558abda0e23
