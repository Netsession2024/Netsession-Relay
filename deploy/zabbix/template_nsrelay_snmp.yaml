zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: db0c8a77aaff4e23b6ca23edeba3e05a
      name: Templates/Applications
  templates:
    - uuid: 5227cc10b5b34e3888a82bb3583c985c
      template: 'Netsession Relay SNMP'
      name: 'Netsession Relay SNMP'
      description: |
        Netsession Relay over SNMP (NETSESSION-RELAY-MIB). Alternative to the HTTP template "Netsession Relay":
        never link both to one host. Needs an SNMP interface (v3 authPriv recommended) on the host.
        Generated by `nsrelay snmp-mib -zabbix`, do not edit by hand.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 14e9f7694bdf47ca882e8cd39473d6fa
          name: 'Relay: Engine erreichbar'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.3.0]'
          key: 'nsrelay.snmp.engine.up'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 61d1a0b8af8c4237a8518a972f20967d
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.engine.up)=2'
              name: 'Relay: Engine antwortet nicht'
              priority: HIGH
              description: 'nsRelayEngineUp ist false: die Web-Rolle erreicht die Engine nicht.'
        - uuid: 75ccb87d31374d438f772de7e4b886d8
          name: 'Relay: Betriebsart'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.5.0]'
          key: 'nsrelay.snmp.mode'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
        - uuid: f554c2f4288549f5ab67e528cdaa6d47
          name: 'Relay: Standby (zweites Relay)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.6.0]'
          key: 'nsrelay.snmp.standby'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 44bba55a161e41359fe5ef39972fb5c3
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.standby)=1'
              name: 'Relay: im Standby, ein anderes Relay ist aktiv'
              priority: AVERAGE
              description: 'Der Wächter hat ein zweites aktives Relay gesehen.'
        - uuid: 09413a5b79804ba093b806631f61400e
          name: 'Relay: leitet weiter'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.7.0]'
          key: 'nsrelay.snmp.sending'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
        - uuid: 8153802fef2548f7a9ab6c4d1a076c16
          name: 'Relay: Engine-Version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.2.0]'
          key: 'nsrelay.snmp.engine.version'
          delay: 1m
          history: 30d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: component
              value: relay
        - uuid: e81bca4393c04373a015f8034513a530
          name: 'Relay: Engine-Laufzeit'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.4.0]'
          key: 'nsrelay.snmp.uptime'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
        - uuid: 943c4a2e73fa41b5acf07de7a4104c6c
          name: 'Relay: Netze'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.10.0]'
          key: 'nsrelay.snmp.vlans'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
        - uuid: 9060ca5f9ce34395bf4df2b30a9418ea
          name: 'Relay: Regeln'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.11.0]'
          key: 'nsrelay.snmp.rules'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
        - uuid: d2a56b7a00dc4e7c889dbd80f97e6aa4
          name: 'Relay: offene Alarme'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.13.0]'
          key: 'nsrelay.snmp.alarms.active'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
        - uuid: 75edd5831ca8446ba1e17941888de2a0
          name: 'Relay: Monitoring-Ziele mit Fehler'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.14.0]'
          key: 'nsrelay.snmp.outputs.failing'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 816ce4368ee34306b94a578388c1c408
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.outputs.failing)>0'
              name: 'Relay: Monitoring-Ziel nicht erreichbar'
              priority: WARNING
              description: 'Ein Syslog-, OpenTelemetry- oder SNMP-Ziel nimmt seit 2 Minuten nichts an.'
        - uuid: a422225c83d7466cb8618c9711570a33
          name: 'Relay: Selbsttest-Befunde'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.1.12.0]'
          key: 'nsrelay.snmp.selftest'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 50b36562b9ea4848958b614b60df1515
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.selftest)>0'
              name: 'Relay: Selbsttest meldet Befunde am Host'
              priority: INFO
              description: 'Details auf der System-Seite.'
        - uuid: f08f6b5e8e454a118d60cbe2b990ae83
          name: 'Relay: empfangen pro Sekunde'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.2.1.0]'
          key: 'nsrelay.snmp.rx.rate'
          delay: 1m
          history: 30d
          value_type: FLOAT
          units: 'fps'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: relay
        - uuid: 3130e791c05c46e191ef810a3d242ec1
          name: 'Relay: gesendet pro Sekunde'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.2.2.0]'
          key: 'nsrelay.snmp.sent.rate'
          delay: 1m
          history: 30d
          value_type: FLOAT
          units: 'fps'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: relay
        - uuid: 47d4d3472ae54ec9b38f4f62885bfec2
          name: 'Relay: Alarm foreign_relay offen'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.4.1.3.1]'
          key: 'nsrelay.snmp.alarm.active[foreign_relay]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 61d9949a050a42b1866c59efab0dcf26
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.alarm.active[foreign_relay])>0'
              name: 'Relay: fremdes Relay aktiv'
              priority: HIGH
              description: 'Ein anderes Gerät leitet dieselben Broadcasts weiter.'
        - uuid: 3367686eb7f84df7b2ae3051949b63d0
          name: 'Relay: Alarm loop offen'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.4.1.3.2]'
          key: 'nsrelay.snmp.alarm.active[loop]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 4fd8e2c636bf4bdb8bbad7ce3c54a6af
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.alarm.active[loop])>0'
              name: 'Relay: Schleife erkannt'
              priority: HIGH
              description: 'Dasselbe Paket kam auf mehreren VLANs an.'
        - uuid: acdb2f0b0c1c4907bf00468252da04b1
          name: 'Relay: Alarm storm offen'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.4.1.3.3]'
          key: 'nsrelay.snmp.alarm.active[storm]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: f377a338a83f44a5b781426845723469
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.alarm.active[storm])>0'
              name: 'Relay: Sturm-Bremse hat eine Regel pausiert'
              priority: AVERAGE
              description: 'Über 5000 Pakete/s auf einem Port.'
        - uuid: 338f536f318e4b199dea5987c950664f
          name: 'Relay: Alarm dual_active offen'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.4.1.3.4]'
          key: 'nsrelay.snmp.alarm.active[dual_active]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 6060dfe7d5af47ca8f416b4626c619c6
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.alarm.active[dual_active])>0'
              name: 'Relay: zweites aktives Relay entdeckt'
              priority: HIGH
              description: 'Zwei Relays für dieselben Netze.'
        - uuid: 605cda7212cd42218c4f9e0d3c3a9138
          name: 'Relay: Alarm vlan_silent offen'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.4.1.3.5]'
          key: 'nsrelay.snmp.alarm.active[vlan_silent]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 59c2500be05541f68fe02a0f2a5bfe55
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.alarm.active[vlan_silent])>0'
              name: 'Relay: Netz ohne Broadcasts seit 10 Minuten'
              priority: WARNING
              description: 'Während eines aktiven Events kam auf einem Netz nichts an.'
        - uuid: a8fa00f42ef342429672bdf66838157f
          name: 'Relay: Alarm engine_down offen'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.32473.1.1.1.4.1.3.6]'
          key: 'nsrelay.snmp.alarm.active[engine_down]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          tags:
            - tag: component
              value: relay
          triggers:
            - uuid: 2a5a4363ee6740e5a92271392ec4a882
              expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.alarm.active[engine_down])>0'
              name: 'Relay: Engine weg (SNMP)'
              priority: HIGH
              description: 'Die Web-Rolle erreicht die Engine nicht.'
        - uuid: 07c84acb5b0145549ce0b16916c3e853
          name: 'Relay: Trap nsRelayAlarmOpened'
          type: SNMP_TRAP
          key: 'snmptrap["enterprises\.32473\.1\.1\.0\.1(\s|$)"]'
          delay: '0'
          history: 30d
          value_type: LOG
          trends: '0'
          description: 'An alarm instance opened. Braucht snmptrapd (ohne geladene MIB) und am Host eine SNMP-Schnittstelle mit der Absender-IP des Relays.'
          tags:
            - tag: component
              value: trap
        - uuid: 987887a33f87448187852ae3fac1637a
          name: 'Relay: Trap nsRelayAlarmCleared'
          type: SNMP_TRAP
          key: 'snmptrap["enterprises\.32473\.1\.1\.0\.2(\s|$)"]'
          delay: '0'
          history: 30d
          value_type: LOG
          trends: '0'
          description: 'An alarm instance ended (quiet for 5 minutes, acknowledged, or the engine is back). Braucht snmptrapd (ohne geladene MIB) und am Host eine SNMP-Schnittstelle mit der Absender-IP des Relays.'
          tags:
            - tag: component
              value: trap
        - uuid: c84e1d4d140040d5b459e2a9756ff391
          name: 'Relay: Trap nsRelayAudit'
          type: SNMP_TRAP
          key: 'snmptrap["enterprises\.32473\.1\.1\.0\.3(\s|$)"]'
          delay: '0'
          history: 30d
          value_type: LOG
          trends: '0'
          description: 'A change in the relay (audit log entry). Braucht snmptrapd (ohne geladene MIB) und am Host eine SNMP-Schnittstelle mit der Absender-IP des Relays.'
          tags:
            - tag: component
              value: trap
      discovery_rules:
        - uuid: b1c02fd3d1384fd499d6de28cb36e7f9
          name: 'Relay: Netze (VLANs) über SNMP'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VLANNAME},1.3.6.1.4.1.32473.1.1.1.5.1.2,{#VLANGROUP},1.3.6.1.4.1.32473.1.1.1.5.1.3]'
          key: nsrelay.snmp.vlan.discovery
          delay: 1h
          lifetime: 7d
          item_prototypes:
            - uuid: b3e8ea7dfe304b698a361fe4de093a8c
              name: 'Netz {#VLANNAME} (VLAN {#SNMPINDEX}): empfangen pro Sekunde'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.32473.1.1.1.5.1.5.{#SNMPINDEX}'
              key: 'nsrelay.snmp.vlan.in.rate[{#SNMPINDEX}]'
              delay: 1m
              history: 30d
              value_type: FLOAT
              units: 'fps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: vlan
                  value: '{#SNMPINDEX} {#VLANNAME}'
            - uuid: ec0645a17db34eadafdc804a2d2b9bbe
              name: 'Netz {#VLANNAME} (VLAN {#SNMPINDEX}): gesendet pro Sekunde'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.32473.1.1.1.5.1.6.{#SNMPINDEX}'
              key: 'nsrelay.snmp.vlan.out.rate[{#SNMPINDEX}]'
              delay: 1m
              history: 30d
              value_type: FLOAT
              units: 'fps'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: vlan
                  value: '{#SNMPINDEX} {#VLANNAME}'
            - uuid: 998d63c8578646aaa49a94485021ecc7
              name: 'Netz {#VLANNAME} (VLAN {#SNMPINDEX}): Sekunden ohne Empfang'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.32473.1.1.1.5.1.8.{#SNMPINDEX}'
              key: 'nsrelay.snmp.vlan.silent_s[{#SNMPINDEX}]'
              delay: 1m
              history: 30d
              value_type: UNSIGNED
              units: 's'
              tags:
                - tag: vlan
                  value: '{#SNMPINDEX} {#VLANNAME}'
            - uuid: e039d6cbc8324ab9aee45182e3ca1edf
              name: 'Netz {#VLANNAME} (VLAN {#SNMPINDEX}): still'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.32473.1.1.1.5.1.9.{#SNMPINDEX}'
              key: 'nsrelay.snmp.vlan.silent[{#SNMPINDEX}]'
              delay: 1m
              history: 30d
              value_type: UNSIGNED
              tags:
                - tag: vlan
                  value: '{#SNMPINDEX} {#VLANNAME}'
              trigger_prototypes:
                - uuid: a0ab70a07725473da79c66792d78bb6d
                  expression: 'last(/Netsession Relay SNMP/nsrelay.snmp.vlan.silent[{#SNMPINDEX}])=1'
                  name: 'Relay: Netz {#VLANNAME} (VLAN {#SNMPINDEX}) still seit 10 Minuten'
                  priority: WARNING
                  description: 'Während eines aktiven Events kam auf diesem Netz kein Broadcast an.'
      tags:
        - tag: class
          value: application
        - tag: target
          value: nsrelay
